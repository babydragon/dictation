<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fbf6ea" />
<meta name="color-scheme" content="light" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="听写" />
<meta name="format-detection" content="telephone=no" />
<title>听写</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%23fbf6ea'/%3E%3Cpath%20d='M9%2011h14M9%2016h14M9%2021h8'%20stroke='%231f2f4a'%20stroke-width='2.4'%20stroke-linecap='round'/%3E%3Ccircle%20cx='24'%20cy='22'%20r='2.6'%20fill='%23d96334'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- 图标：内联 SVG sprite，无外部资源 -->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6c0 1 1.1 1.6 1.9 1L20.2 13c.7-.5.7-1.5 0-2L9.9 4.2C9.1 3.6 8 4.2 8 5.2Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.4" y="4.8" width="3.7" height="14.4" rx="1.5" fill="currentColor" stroke="none"/><rect x="13.9" y="4.8" width="3.7" height="14.4" rx="1.5" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.8 5.4 8 12l6.8 6.6"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.4 5.4 16.2 12l-6.8 6.6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.6 9.8 17.4 19 7.2"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4.2 9.4h3.3l4.9-3.7v12.6l-4.9-3.7H4.2z"/><path d="M15.9 9.2a4.1 4.1 0 0 1 0 5.6"/><path d="M18.4 6.6a7.7 7.7 0 0 1 0 10.8"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20.4 12a8.4 8.4 0 1 1-2.6-6.1"/><path d="M20.4 4.2v5h-5"/></symbol>
</svg>

<div class="app">

  <!-- ================= 首页 ================= -->
  <section class="screen" id="screen-home">
    <header class="home-head">
      <div class="home-head-main">
        <p class="eyebrow" id="home-date">今天</p>
        <h1 class="brand">听写</h1>
      </div>
      <span class="mock-badge" id="mock-badge" hidden>预览模式</span>
    </header>
    <div class="home-body" id="home-body"></div>
  </section>

  <!-- ================= 播放页 ================= -->
  <section class="screen screen-player" id="screen-player" hidden>
    <header class="player-head">
      <button class="btn-quiet" id="player-back" type="button">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-back" xlink:href="#i-back"></use></svg>
        <span>返回</span>
      </button>
      <p class="player-title" id="player-title"></p>
    </header>

    <div class="player-main">
      <p class="player-status" id="player-status"><span class="dot" aria-hidden="true"></span><span id="player-status-text">准备中…</span></p>
      <p class="counter" aria-live="polite" aria-atomic="true">
        <span class="counter-now" id="counter-now">1</span>
        <span class="counter-sep" aria-hidden="true">/</span>
        <span class="counter-total" id="counter-total">1</span>
      </p>
      <div class="segments" id="segments" aria-hidden="true"></div>
    </div>

    <div class="player-actions">
      <button class="btn btn-primary btn-xl" id="btn-toggle" type="button">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-pause" xlink:href="#i-pause"></use></svg>
        <span id="btn-toggle-label">暂停</span>
      </button>
      <button class="btn btn-ghost btn-block" id="btn-replay" type="button" disabled>重听这个词</button>
    </div>
  </section>

  <!-- ================= 完成页 ================= -->
  <section class="screen" id="screen-done" hidden>
    <div class="center-wrap">
      <div class="seal" aria-hidden="true">
        <svg class="icon" focusable="false"><use href="#i-check" xlink:href="#i-check"></use></svg>
      </div>
      <h2 class="big-title">听写完成</h2>
      <p class="muted" id="done-meta">20 个词 · 用时 03:05</p>
      <div class="stack">
        <button class="btn btn-accent btn-xl" id="btn-check" type="button">检查</button>
        <button class="btn btn-secondary btn-block" id="btn-again" type="button">再听一遍</button>
        <button class="btn btn-ghost btn-block" id="btn-done-home" type="button">返回首页</button>
      </div>
    </div>
  </section>

  <!-- ================= 检查页 ================= -->
  <section class="screen screen-check" id="screen-check" hidden>
    <header class="check-head">
      <p class="eyebrow">检查</p>
      <h2 class="check-title">对照答案，写错的点一下</h2>
    </header>
    <ul class="check-list" id="check-list"></ul>
    <div class="check-bar">
      <div class="check-bar-inner">
        <div class="check-bar-top">
          <span class="check-count" aria-live="polite">已标错 <b id="check-count">0</b> 个</span>
          <button class="btn-quiet" id="btn-skip" type="button">跳过</button>
        </div>
        <button class="btn btn-accent btn-lg btn-block" id="btn-submit" type="button">完成检查</button>
      </div>
    </div>
  </section>

  <!-- ================= 结果页 ================= -->
  <section class="screen" id="screen-result" hidden>
    <div class="center-wrap">
      <p class="eyebrow">检查结果</p>
      <p class="result-score" aria-live="polite">
        <span class="score-ok" id="result-correct">0</span><span class="score-unit">对</span>
        <span class="score-sep" aria-hidden="true">/</span>
        <span class="score-bad" id="result-wrong">0</span><span class="score-unit">错</span>
      </p>
      <p class="muted" id="result-note"></p>
      <div class="chips" id="result-words"></div>
      <div class="stack">
        <button class="btn btn-primary btn-xl" id="btn-result-home" type="button">返回首页</button>
      </div>
    </div>
  </section>

  <!-- ================= 播放失败 ================= -->
  <section class="screen" id="screen-error" hidden>
    <div class="center-wrap">
      <p class="eyebrow">播放中断</p>
      <h2 class="big-title">音频加载失败</h2>
      <p class="muted">检查一下网络，回到首页重新开始就好。</p>
      <div class="stack">
        <button class="btn btn-primary btn-xl" id="btn-error-home" type="button">返回首页</button>
      </div>
    </div>
  </section>

</div>

<!-- 二次确认 -->
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-text">
    <h2 class="modal-title" id="modal-title">确定离开吗？</h2>
    <p class="modal-text" id="modal-text"></p>
    <div class="modal-actions">
      <button class="btn btn-primary btn-block" id="modal-confirm" type="button">离开</button>
      <button class="btn btn-ghost btn-block" id="modal-cancel" type="button">继续听写</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<audio id="audio" preload="auto" playsinline></audio>

<script src="app.js" defer></script>
</body>
</html>
